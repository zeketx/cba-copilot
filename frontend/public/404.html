<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-ground="sage" data-buttons="pill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found · CBA Copilot</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="This address is not a CBA Copilot page." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ecebe7" />
    <link rel="stylesheet" href="/assets/system.css" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("/fonts/instrument-serif-latin-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("/fonts/instrument-serif-latin-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("/fonts/instrument-sans-latin-wght.woff2") format("woff2");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --p-bg: #ecebe7;
        --p-surface: #e1dfd9;
        --p-ink: #1e240d;
        --p-muted: #515b31;
        --p-accent: #38450f;
        --p-accent-ink: #ecebe7;
        --p-action: #38450f;
        --p-action-ink: #ecebe7;
        --font-display: "Instrument Serif", Georgia, serif;
        --font-text: "Instrument Sans", system-ui, sans-serif;
        --display-weight: 400;
        --display-tracking: -0.015em;
        --display-tracking-xl: -0.022em;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--p-bg);
        color: var(--p-ink);
      }
      body {
        display: grid;
        place-items: center;
        padding: 32px 24px;
        font-family: var(--font-text);
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      .mark {
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.45em;
        border-radius: 2px;
        background: var(--p-action);
        vertical-align: 0.05em;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        margin: 0 0 28px;
        color: var(--p-ink);
        font-family: var(--font-display);
        font-size: 23px;
        letter-spacing: -0.01em;
        text-decoration: none;
      }
      h1 {
        margin: 0 0 12px;
        font-family: var(--font-display);
        font-size: clamp(40px, 6vw, 64px);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.022em;
      }
      h1 em {
        font-style: italic;
        color: var(--p-accent);
      }
      p {
        margin: 0 0 28px;
        color: var(--p-muted);
        font-size: 17px;
        line-height: 1.5;
      }
      .btn--primary {
        color: var(--p-action-ink);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="wordmark" href="/">
        <span class="mark" aria-hidden="true"></span>
        CBA Copilot
      </a>
      <h1>This page was <em>not found</em></h1>
      <p>
        CBA Copilot is an invite-only research app. There is no page at this address.
      </p>
      <a class="btn btn--primary" href="/">Back to CBA Copilot</a>
    </main>
  </body>
</html>
